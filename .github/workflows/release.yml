name: Build & Release AmnShield Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build & Test Browser Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npx tsx tests/content-blockers.test.ts

      - name: Build WXT Extension Output
        run: npm run build

      - name: Package Extension Zip
        run: |
          mkdir -p release_zip
          cd .output/chrome-mv3 && zip -r "../../release_zip/AmnShield-Extension-Chrome-MV3.zip" . && cd ../..

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v29.7.2026' }}
          name: AmnShield Extension ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v29.7.2026' }}
          body: |
            ## 🌐 AmnShield Browser Extension v29.7.2026
            - **DeclarativeNetRequest Rule Engine**: Instant C++ browser network layer blocking & tab redirection.
            - **Mindful Block Screen**: Branded full-screen pause & quote screen with breathing indicator.
            - **Live Desktop App Sync**: Auto-polls `http://127.0.0.1:48192/status` for active domain list.
          draft: false
          prerelease: false
          files: |
            release_zip/AmnShield-Extension-Chrome-MV3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
