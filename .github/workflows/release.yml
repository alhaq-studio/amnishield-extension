name: Test, Build & Publish Browser Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. RIGOROUS TESTING & VALIDATION PHASE (Quality Gate)
  # =========================================================================
  test-and-validate:
    name: 🧪 Rigorous Automated Testing & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run compile

      - name: Run Content Blocker & SafeSearch Tests
        run: npx tsx tests/content-blockers.test.ts

      - name: Run URL & Keyword Matcher Tests
        run: npx tsx tests/url-matcher.test.ts

      - name: Test Production Build Output
        run: npm run build

      - name: Validate Manifest & Output Assets
        run: |
          if [ ! -f .output/chrome-mv3/manifest.json ]; then
            echo "❌ Error: manifest.json is missing in build output!"
            exit 1
          fi
          echo "✅ Build output validated successfully."

  # =========================================================================
  # 2. BUILD, RELEASE & STORE SUBMISSION PHASE (Gated by Test Success)
  # =========================================================================
  publish-and-release:
    name: 🚀 Build Release & Auto-Submit to Edge Add-ons
    needs: [test-and-validate]
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Extension (Chrome / Edge MV3)
        run: npm run build

      - name: Package Extension Zips
        run: |
          mkdir -p release_zip
          cd .output/chrome-mv3 && zip -r "../../release_zip/AmniShield-Extension-Edge.zip" . && cd ../..
          cp release_zip/AmniShield-Extension-Edge.zip release_zip/AmniShield-Extension-Chrome-MV3.zip

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2026.8.27' }}
          name: AmniShield Extension ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2026.8.27' }}
          body: |
            ## 🌐 AmniShield Browser Extension
            - **DeclarativeNetRequest Rule Engine**: Instant browser network layer blocking & tab redirection.
            - **Mindful Block Screen**: Branded full-screen pause & quote screen with breathing indicator.
            - **100% Zero-Knowledge Privacy**: All filtering and rule matching executes locally on-device.
            - **Automated Verification**: Passed complete TypeScript compilation and test suites before packaging.
          draft: false
          prerelease: false
          files: |
            release_zip/AmniShield-Extension-Edge.zip
            release_zip/AmniShield-Extension-Chrome-MV3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Microsoft Edge Add-ons
        uses: wxt-dev/publish-extension@v1
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && (secrets.Key_1 != '' || secrets.KEY_1 != '' || secrets.EDGE_KEY_1 != '' || secrets.EDGE_API_KEY != '' || secrets.EDGE_CLIENT_SECRET != '')
        with:
          edge-zip: release_zip/AmniShield-Extension-Edge.zip
          edge-product-id: ${{ secrets.EDGE_PRODUCT_ID || secrets.EDGE_EXTENSION_ID || secrets.PRODUCT_ID }}
          edge-client-id: ${{ secrets.EDGE_CLIENT_ID || secrets.CLIENT_ID }}
          edge-client-secret: ${{ secrets.Key_1 || secrets.KEY_1 || secrets.EDGE_KEY_1 || secrets.EDGE_API_KEY || secrets.EDGE_CLIENT_SECRET }}
          edge-notes: "Automated release update for AmniShield website content blocker passing all automated tests."
