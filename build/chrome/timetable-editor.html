<!-- Phase 2: Interactive Timetable Editor Modal -->
<div id="scheduleModal" class="hidden" aria-modal="true" role="dialog" aria-labelledby="scheduleTitle">
  <div id="scheduleBackdrop" style="position:fixed;inset:0;background:rgba(0,0,0,.45);"></div>
  <div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#222;max-width:920px;width:95%;max-height:90vh;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;">
    <div style="padding:14px 16px;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;justify-content:space-between;">
      <h3 id="scheduleTitle" style="margin:0;font-size:16px;">📅 Weekly Timetable Editor</h3>
      <button id="closeScheduleBtn" class="button-secondary" type="button">✖</button>
    </div>
    
    <div id="scheduleDisabledNotice" class="hidden" style="margin:10px 16px 0 16px;padding:10px;border:1px solid #ffeaa7;background:#fffbe6;color:#856404;border-radius:6px;">
      Schedule is disabled. Enable "Schedule Attachment" to apply time-based blocking.
    </div>
    
    <!-- Category Legend -->
    <div style="padding:12px 16px;border-bottom:1px solid #e6e6e6;">
      <div style="font-weight:600;margin-bottom:8px;font-size:13px;">Blocking Categories:</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;">
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="haram" style="width:16px;height:16px;background:#dc2626;border-radius:3px;"></span>
          <span>Haram</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="social" style="width:16px;height:16px;background:#3b82f6;border-radius:3px;"></span>
          <span>Social</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="games" style="width:16px;height:16px;background:#f59e0b;border-radius:3px;"></span>
          <span>Games</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="entertainment" style="width:16px;height:16px;background:#8b5cf6;border-radius:3px;"></span>
          <span>Entertainment</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="streaming" style="width:16px;height:16px;background:#ec4899;border-radius:3px;"></span>
          <span>Streaming</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="shopping" style="width:16px;height:16px;background:#10b981;border-radius:3px;"></span>
          <span>Shopping</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <span class="category-badge" data-category="news" style="width:16px;height:16px;background:#6366f1;border-radius:3px;"></span>
          <span>News</span>
        </div>
      </div>
    </div>
    
    <!-- Timetable Grid -->
    <div style="flex:1;overflow:auto;padding:12px 16px;">
      <div id="timetableGrid" style="display:grid;grid-template-columns:50px repeat(7,1fr);gap:1px;background:#e5e7eb;border:1px solid #e5e7eb;font-size:12px;">
        <!-- Header Row -->
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Hour</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Sun</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Mon</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Tue</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Wed</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Thu</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Fri</div>
        <div style="background:#f3f4f6;padding:8px;text-align:center;font-weight:600;position:sticky;top:0;z-index:10;">Sat</div>
        
        <!-- Time Cells (will be generated by JavaScript) -->
      </div>
    </div>
    
    <!-- Range Editor Panel -->
    <div id="rangeEditorPanel" class="hidden" style="padding:12px 16px;border-top:1px solid #e6e6e6;background:#f9fafb;">
      <div style="display:flex;gap:16px;align-items:start;">
        <div style="flex:1;">
          <label style="display:block;margin-bottom:4px;font-weight:600;font-size:13px;">Selected Time Range:</label>
          <div id="selectedRangeDisplay" style="padding:8px 12px;background:#fff;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-height:38px;"></div>
        </div>
        <div style="flex:2;">
          <label style="display:block;margin-bottom:4px;font-weight:600;font-size:13px;">Block These Categories:</label>
          <div id="categoryCheckboxes" style="display:flex;flex-wrap:wrap;gap:8px;">
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="haram" style="margin:0;cursor:pointer;" />
              <span>Haram</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="social" style="margin:0;cursor:pointer;" />
              <span>Social</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="games" style="margin:0;cursor:pointer;" />
              <span>Games</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="entertainment" style="margin:0;cursor:pointer;" />
              <span>Entertainment</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="streaming" style="margin:0;cursor:pointer;" />
              <span>Streaming</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="shopping" style="margin:0;cursor:pointer;" />
              <span>Shopping</span>
            </label>
            <label style="display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;">
              <input type="checkbox" value="news" style="margin:0;cursor:pointer;" />
              <span>News</span>
            </label>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button id="applyRangeBtn" class="button-primary" type="button" style="white-space:nowrap;">Apply</button>
          <button id="deleteRangeBtn" class="button-secondary" type="button" style="white-space:nowrap;">Delete</button>
        </div>
      </div>
    </div>
    
    <!-- Footer Actions -->
    <div style="padding:12px 16px;border-top:1px solid #e6e6e6;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="display:flex;gap:8px;">
        <button id="exportScheduleBtn" class="button-secondary" type="button">📤 Export</button>
        <button id="importScheduleBtn" class="button-secondary" type="button">📥 Import</button>
        <button id="resetScheduleBtn" class="button-secondary" type="button">🔄 Reset</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button id="copyScheduleJsonBtn" class="button-secondary" type="button">Copy JSON</button>
        <button id="saveScheduleBtn" class="button-primary" type="button">💾 Save Schedule</button>
        <button id="closeScheduleBtnBottom" class="button-secondary" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden file input for import -->
<input type="file" id="importScheduleFileInput" accept=".json" style="display:none;" />
